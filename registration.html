
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | Campus Music Club</title>
    <meta name="description" content="Register your interest in joining Campus Music Club.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

    <header>
        <h1>Club Registration</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="registration.html">Registration</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Join Our Music Community</h2>
        <p>Complete the form to register your interest.</p>

        <form action="#" method="post">

            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   pattern="[0-9]{10}"
                   title="Enter a 10-digit phone number" required>
            <br><br>

            <label for="course">Course:</label>
            <input type="text" id="course" name="course" required>
            <br><br>

            <label for="year">Year of Study:</label>
            <select id="year" name="year" required>
                <option value="">-- Select Year --</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>
            <br><br>

            <label for="interest">Musical Interest:</label>
            <select id="interest" name="interest" required>
                <option value="">-- Select Interest --</option>
                <option value="singing">Singing</option>
                <option value="guitar">Guitar</option>
                <option value="keyboard">Keyboard</option>
                <option value="drums">Drums</option>
                <option value="other">Other</option>
            </select>
            <br><br>

            <label for="experience">Previous Music Experience:</label>
            <br>
            <textarea id="experience" name="experience"
                      rows="4" cols="35"
                      placeholder="Tell us about your musical experience"></textarea>
            <br><br>

            <input type="checkbox" id="agreement" name="agreement"
                   required>
            <label for="agreement">I agree to participate in club activities.</label>
            <br><br>

            <button type="submit">Submit Registration</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Campus Music Club.</p>
    </footer>

</body>
</html>
